[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "code-migration-agent"
version = "0.1.0"
description = "Deterministic Python migration recipes plus a budgeted, sandboxed agent loop."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pedro Monteiro" }]
dependencies = [
  "libcst==1.9.0",
  "coverage==7.17.4",
]

[project.scripts]
cma = "code_migration_agent.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "mypy==2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_migration_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
